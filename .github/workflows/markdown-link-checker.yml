# Check links in Markdown files (docs, README, etc.)
name: Markdown link check

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.md'

permissions:
  contents: read

jobs:
  linkcheck:
    name: Check Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lychee link checker
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          fail: true
          # Don't fail on 403 (Forbidden), 429 (rate limit), or 200.
          # github.com answers 503 under load, so retry with a wait and
          # cap concurrency instead of failing on the first transient error.
          args: >-
            --accept "200,403,429"
            --max-retries 5
            --retry-wait-time 10
            --max-concurrency 8
            --verbose --no-progress './**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
