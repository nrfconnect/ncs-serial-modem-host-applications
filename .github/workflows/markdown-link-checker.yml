name: Markdown link check

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.md'

permissions:
  contents: read

jobs:
  linkcheck:
    name: Check Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lychee link checker
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          fail: true
          # github.com answers 503 under load, hence the retries and concurrency cap.
          # Main-branch links are checked against the checkout so PRs that add or move files pass.
          args: >-
            --accept "200,403,429"
            --remap 'https://github\.com/nrfconnect/ncs-serial-modem-host-applications/(?:blob|tree)/main/([^#?]*) file://${{ github.workspace }}/$1'
            --max-retries 5
            --retry-wait-time 10
            --max-concurrency 8
            --verbose --no-progress './**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
