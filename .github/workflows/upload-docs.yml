# Bundle the documentation and publish it to Fluid Topics.
#
# Combines bundling and upload in one workflow: one job zips the docs, the
# publish jobs download that artifact and push it to the Fluid Topics dev and
# prod sources. Publishing is skipped when the Fluid Topics secrets are absent.

name: Upload documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-doc-bundle:
    name: Create documentation bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create zip file
        run: |
          zip -r serial-modem-host-applications-ft.zip \
            docs mkdocs.yml
          echo "Bundle contents:"
          unzip -l serial-modem-host-applications-ft.zip

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial-modem-host-applications-ft
          path: serial-modem-host-applications-ft.zip
          retention-days: 7

  publish-docs-ft-dev:
    name: Publish documentation to ft dev
    needs: create-doc-bundle
    runs-on: ubuntu-latest
    container:
      image: fluidtopics/publish:latest
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: serial-modem-host-applications-ft

      - name: Publish documentation to fluid topics dev
        env:
          FT_URL: ${{ secrets.FLUIDTOPICS_URL_DEV }}
          FT_API_KEY: ${{ secrets.FLUIDTOPICS_API_KEY_DEV }}
          FT_SOURCE: ${{ secrets.FLUIDTOPICS_SOURCE_ID }}
        run: |
          if [ -z "$FT_URL" ] || [ -z "$FT_API_KEY" ] || [ -z "$FT_SOURCE" ]; then
            echo "::warning::Fluid Topics secrets are not configured; skipping upload"
            exit 0
          fi
          ftpub publish serial-modem-host-applications-ft.zip "$FT_URL" -a "$FT_API_KEY" -s "$FT_SOURCE"

  publish-docs-ft-prod:
    name: Publish documentation to ft prod
    needs: create-doc-bundle
    runs-on: ubuntu-latest
    container:
      image: fluidtopics/publish:latest
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: serial-modem-host-applications-ft

      - name: Publish documentation to fluid topics prod
        env:
          FT_URL: ${{ secrets.FLUIDTOPICS_URL_PROD }}
          FT_API_KEY: ${{ secrets.FLUIDTOPICS_API_KEY_PROD }}
          FT_SOURCE: ${{ secrets.FLUIDTOPICS_SOURCE_ID }}
        run: |
          if [ -z "$FT_URL" ] || [ -z "$FT_API_KEY" ] || [ -z "$FT_SOURCE" ]; then
            echo "::warning::Fluid Topics secrets are not configured; skipping upload"
            exit 0
          fi
          ftpub publish serial-modem-host-applications-ft.zip "$FT_URL" -a "$FT_API_KEY" -s "$FT_SOURCE"
