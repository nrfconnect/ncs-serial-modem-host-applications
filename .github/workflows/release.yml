name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          merge-multiple: false
          path: firmware

      - name: Prepare release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p release-assets

          copy_release_file() {
            local src="$1"
            local dest="$2"
            if [ -f "$src" ]; then
              cp "$src" "$dest"
            else
              echo "::warning title=Missing release asset::${src}"
            fi
          }

          for artifact_dir in firmware/firmware-*; do
            [ -d "$artifact_dir" ] || continue

            rest="${artifact_dir#firmware/firmware-}"
            app="${rest%-*}"
            board_type="${rest##*-}"
            root="$artifact_dir"
            zephyr="${root}/${app}/zephyr"
            prefix="release-assets/${app}-${board_type}-v${VERSION}"

            copy_release_file "${root}/merged.hex" "${prefix}.merged.hex"
            copy_release_file "${zephyr}/zephyr.elf" "${prefix}.elf"
            copy_release_file "${zephyr}/.config" "${prefix}.config"
            if [ "$app" != "93m1_at" ]; then
              copy_release_file "${zephyr}/zephyr.signed.bin" "${prefix}.signed.bin"
            fi
          done

          ls -la release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: release-assets/*
