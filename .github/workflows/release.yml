name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware

      - name: Prepare release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p release-assets
          for app in 91m1_ppp 93m1_ppp 93m1_at; do
            signed="firmware/${app}/zephyr/zephyr.signed.bin"
            elf="firmware/${app}/zephyr/zephyr.elf"
            if [ -f "$signed" ]; then
              cp "$signed" "release-assets/${app}-v${VERSION}.signed.bin"
            fi
            if [ -f "$elf" ]; then
              cp "$elf" "release-assets/${app}-v${VERSION}.elf"
            fi
          done
          ls -la release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: release-assets/*
