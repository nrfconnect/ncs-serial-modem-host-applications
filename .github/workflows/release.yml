name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          merge-multiple: false
          path: firmware

      - name: Prepare release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p release-assets release-staging release-meta

          copy_release_file() {
            local src="$1"
            local dest="$2"
            if [ -f "$src" ]; then
              cp "$src" "$dest"
            else
              echo "::warning title=Missing release asset::${src}"
            fi
          }

          # Attaches the pinned Serial Modem bundle as a release asset, and
          # writes the note the 91m1 bundles below carry. Runs first so the
          # note exists before any bundle is zipped.
          pip install --quiet pyyaml
          REPO_ROOT=$PWD PYTHONPATH=tests/on_target python3 <<'PY'
          from pathlib import Path

          from utils.serial_modem_firmware import (
              download_serial_modem_release_bundle,
              write_serial_modem_version_note,
          )

          download_serial_modem_release_bundle(Path("release-assets"), root=Path("."))
          write_serial_modem_version_note(Path("release-meta"), root=Path("."))
          PY

          for artifact_dir in firmware/firmware-*; do
            [ -d "$artifact_dir" ] || continue

            # Application names never contain a hyphen, so the first hyphen
            # splits app from board type. Board types may contain hyphens
            # themselves, e.g. nrf54lm20b-location.
            rest="${artifact_dir#firmware/firmware-}"
            app="${rest%%-*}"
            board_type="${rest#*-}"
            root="$artifact_dir"
            zephyr="${root}/${app}/zephyr"

            # An application build always has <app>/zephyr in its artifact.
            # Anything else carries a name this loop cannot parse, and zipping
            # it would ship a bogus asset: v0.5.0 gained a serial-modem-dbg zip
            # that way, from a test-only artifact then named firmware-*.
            if [ ! -d "$zephyr" ]; then
              echo "::warning title=Not an application build, skipping::${artifact_dir}"
              continue
            fi

            bundle_name="${app}-${board_type}-v${VERSION}"
            bundle_dir="release-staging/${bundle_name}"
            mkdir -p "$bundle_dir"

            copy_release_file "${root}/merged.hex" "${bundle_dir}/merged.hex"
            copy_release_file "${zephyr}/zephyr.elf" "${bundle_dir}/zephyr.elf"
            copy_release_file "${zephyr}/.config" "${bundle_dir}/.config"
            if [ "$app" != "93m1_at" ]; then
              copy_release_file "${zephyr}/zephyr.signed.bin" "${bundle_dir}/zephyr.signed.bin"
            fi

            # Only 91m1 hosts pair with a Serial Modem DK. A 93m1 board has an
            # integrated modem, so the note would misinform there.
            case "$app" in
            91m1_*)
              copy_release_file "release-meta/serial-modem-version.txt" \
                "${bundle_dir}/serial-modem-version.txt"
              ;;
            esac

            (
              cd "$bundle_dir"
              zip -r "../../release-assets/${bundle_name}.zip" .
            )
          done

          ls -la release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: release-assets/*
