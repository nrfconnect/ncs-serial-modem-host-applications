name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.2.3)
        required: true
        type: string
      serial_modem_release:
        description: Upstream Serial Modem release tag bundled in nRF54 host zips (empty = resolve latest)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.2.3)
        required: true
        type: string
      serial_modem_release:
        description: Upstream Serial Modem release tag bundled in nRF54 host zips (empty = resolve latest)
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          merge-multiple: false
          path: firmware

      - name: Prepare release assets
        env:
          VERSION: ${{ inputs.version }}
          SERIAL_MODEM_RELEASE: ${{ inputs.serial_modem_release }}
          REPO_ROOT: ${{ github.workspace }}
          # Each bundle README resolves the release in its own process, with no shared cache.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p release-assets release-staging

          copy_release_file() {
            local src="$1"
            local dest="$2"
            if [ -f "$src" ]; then
              cp "$src" "$dest"
            else
              echo "::warning title=Missing release asset::${src}"
            fi
          }

          # Shipped as published upstream, not extracted. The path goes through a
          # file because the download logs to stdout.
          pip install --quiet pyyaml
          PYTHONPATH=tests/on_target python3 -c "
          from pathlib import Path

          from utils.serial_modem_firmware import download_serial_modem_bundle

          zip_path = download_serial_modem_bundle(root=Path('.'))
          Path('modem-zip-path.txt').write_text(str(zip_path), encoding='utf-8')
          "
          modem_zip="$(cat modem-zip-path.txt)"

          for artifact_dir in firmware/firmware-*; do
            [ -d "$artifact_dir" ] || continue

            # App names never contain a hyphen; board types may (nrf54lm20b-location).
            rest="${artifact_dir#firmware/firmware-}"
            app="${rest%%-*}"
            board_type="${rest#*-}"
            root="$artifact_dir"
            zephyr="${root}/${app}/zephyr"

            # Artifacts without <app>/zephyr are not application builds.
            if [ ! -d "$zephyr" ]; then
              echo "::warning title=Not an application build, skipping::${artifact_dir}"
              continue
            fi

            bundle_name="${app}-${board_type}-v${VERSION}"
            bundle_dir="release-staging/${bundle_name}"
            mkdir -p "$bundle_dir"

            copy_release_file "${root}/merged.hex" "${bundle_dir}/merged.hex"
            copy_release_file "${zephyr}/zephyr.elf" "${bundle_dir}/zephyr.elf"
            copy_release_file "${zephyr}/.config" "${bundle_dir}/.config"
            if [ "$app" != "93m1_at" ] && [ "$app" != "91m1_at" ]; then
              copy_release_file "${zephyr}/zephyr.signed.bin" "${bundle_dir}/zephyr.signed.bin"
              copy_release_file "${root}/dfu_application.zip" "${bundle_dir}/dfu_application.zip"
            fi

            # The nRF93M1 DK has an integrated modem, so only nRF54 bundles get the modem archive.
            case "$board_type" in
            nrf54*)
              cp "$modem_zip" "${bundle_dir}/"
              ;;
            esac

            python3 scripts/ci/write_release_readme.py "$bundle_dir" \
              --app "$app" --board-type "$board_type" --version "$VERSION"

            (
              cd "$bundle_dir"
              zip -r "../../release-assets/${bundle_name}.zip" .
            )
          done

          ls -la release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: release-assets/*
