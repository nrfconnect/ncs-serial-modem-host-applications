name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.2.3)
        required: true
        type: string
      serial_modem_release:
        description: Upstream Serial Modem release tag bundled in nRF54 host zips (empty = resolve latest)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.2.3)
        required: true
        type: string
      serial_modem_release:
        description: Upstream Serial Modem release tag bundled in nRF54 host zips (empty = resolve latest)
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          merge-multiple: false
          path: firmware

      - name: Prepare release assets
        env:
          VERSION: ${{ inputs.version }}
          SERIAL_MODEM_RELEASE: ${{ inputs.serial_modem_release }}
          REPO_ROOT: ${{ github.workspace }}
          # Each bundle README resolves the release in its own process, so
          # these lookups do not share the in-process cache.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p release-assets release-staging

          copy_release_file() {
            local src="$1"
            local dest="$2"
            if [ -f "$src" ]; then
              cp "$src" "$dest"
            else
              echo "::warning title=Missing release asset::${src}"
            fi
          }

          # Fetched once, before any bundle is zipped. Ships as published
          # upstream rather than extracted, so the archive people download
          # here is the one the Serial Modem release page serves.
          # The path goes through a file because the download logs to stdout,
          # which would end up inside a command substitution.
          pip install --quiet pyyaml
          PYTHONPATH=tests/on_target python3 -c "
          from pathlib import Path

          from utils.serial_modem_firmware import download_serial_modem_bundle

          zip_path = download_serial_modem_bundle(root=Path('.'))
          Path('modem-zip-path.txt').write_text(str(zip_path), encoding='utf-8')
          "
          modem_zip="$(cat modem-zip-path.txt)"

          for artifact_dir in firmware/firmware-*; do
            [ -d "$artifact_dir" ] || continue

            # Application names never contain a hyphen, so the first hyphen
            # splits app from board type. Board types may contain hyphens
            # themselves, e.g. nrf54lm20b-location.
            rest="${artifact_dir#firmware/firmware-}"
            app="${rest%%-*}"
            board_type="${rest#*-}"
            root="$artifact_dir"
            zephyr="${root}/${app}/zephyr"

            # An application build always has <app>/zephyr in its artifact.
            # Anything else carries a name this loop cannot parse, and zipping
            # it would ship a bogus asset: v0.5.0 gained a serial-modem-dbg zip
            # that way, from a test-only artifact then named firmware-*.
            if [ ! -d "$zephyr" ]; then
              echo "::warning title=Not an application build, skipping::${artifact_dir}"
              continue
            fi

            bundle_name="${app}-${board_type}-v${VERSION}"
            bundle_dir="release-staging/${bundle_name}"
            mkdir -p "$bundle_dir"

            copy_release_file "${root}/merged.hex" "${bundle_dir}/merged.hex"
            copy_release_file "${zephyr}/zephyr.elf" "${bundle_dir}/zephyr.elf"
            copy_release_file "${zephyr}/.config" "${bundle_dir}/.config"
            # The AT applications ship neither an update payload nor the signed
            # image it is built from.
            if [ "$app" != "93m1_at" ] && [ "$app" != "91m1_at" ]; then
              copy_release_file "${zephyr}/zephyr.signed.bin" "${bundle_dir}/zephyr.signed.bin"
              copy_release_file "${root}/dfu_application.zip" "${bundle_dir}/dfu_application.zip"
            fi

            # Only the nRF54 hosts pair with a Serial Modem DK. The nRF93M1 DK
            # has an integrated modem, so the modem archive does not belong in
            # its bundle.
            case "$board_type" in
            nrf54*)
              cp "$modem_zip" "${bundle_dir}/"
              ;;
            esac

            python3 scripts/ci/write_release_readme.py "$bundle_dir" \
              --app "$app" --board-type "$board_type" --version "$VERSION"

            (
              cd "$bundle_dir"
              zip -r "../../release-assets/${bundle_name}.zip" .
            )
          done

          ls -la release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: release-assets/*

  # CI writes the release version into the VERSION files only for the build,
  # so the checked-in copies would otherwise fall behind the tags. main only
  # takes changes through a pull request, so the sync goes through one too.
  # A chore commit does not count towards the next version bump.
  sync-version:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Open and merge VERSION sync pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          python3 scripts/ci/write_version.py "$VERSION" applications

          if git diff --quiet -- applications; then
            echo "::notice title=VERSION already in sync::applications/*/VERSION already at ${VERSION}"
            exit 0
          fi

          branch="ci/sync-version-v${VERSION}"
          title="chore: applications: set VERSION to ${VERSION}"
          body="Sync the checked-in application VERSION files with release v${VERSION}."

          # Two-word name: the compliance gitlint rule requires a full name in
          # the sign-off.
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add applications/*/VERSION
          git commit -s -m "$title" -m "$body"
          # Forced so that a re-run replaces the branch from a failed attempt.
          git push --force origin "$branch"

          pr_url="$(gh pr list --head "$branch" --base main --state open --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base main --head "$branch" --title "$title" --body "$body")"
          fi

          # The release is already published, so a blocked merge must not
          # fail the run. The pull request stays open for a maintainer.
          if ! gh pr merge "$pr_url" --rebase --delete-branch; then
            echo "::warning title=VERSION sync not merged::Merge ${pr_url} by hand"
          fi
