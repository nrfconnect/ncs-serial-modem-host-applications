      CI_NRF93M1_PROVISION_MODEM_UUID: ${{ vars.CI_NRF93M1_PROVISION_MODEM_UUID }}
      NRF_CLOUD_TENANT_ID: ${{ vars.NRF_CLOUD_TENANT_ID }}
      MEMFAULT_ORG_TOKEN: ${{ secrets.MEMFAULT_ORG_TOKEN }}
