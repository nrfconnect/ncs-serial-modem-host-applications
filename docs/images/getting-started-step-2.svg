<svg xmlns="http://www.w3.org/2000/svg" width="900" height="178" viewBox="0 0 900 178" role="img" aria-labelledby="title desc">
  <title id="title">Getting started, step 2</title>
  <desc id="desc">Step 2 of 6: Set up the repository and toolchain. Step 1 is Choose your application. Steps 3 to 6 follow in your application guide.</desc>
  <!-- Colors follow the Nordic Semiconductor brand palette:
       Blue Slate #0033A0, Lake #0077C8, Nordic Blue #00A9CE, Sky #6AD1E3,
       Light Grey #D9E1E2, Middle Grey #768692, Dark Grey #333F48. -->
  <style>
    text { font-family: "GT Walsheim Pro", "GT Walsheim", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .track { stroke: #d9e1e2; stroke-width: 4; }
    .track.on { stroke: #00a9ce; }
    .dot { fill: #d9e1e2; }
    .dot.on { fill: #0077c8; }
    .num { font-size: 20px; font-weight: 700; fill: #333f48; }
    .num.on { fill: #ffffff; }
    .label { font-size: 14px; fill: #768692; }
    .label.on { font-weight: 700; fill: #333f48; }
    .page { stroke: #d9e1e2; stroke-width: 2; fill: none; }
    .page.on { stroke: #0077c8; }
    .pagelabel { font-size: 13px; fill: #768692; }
    .pagelabel.on { font-weight: 700; fill: #0077c8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #333f48; }
      .track, .page { stroke: #768692; }
      .dot { fill: #768692; }
      .num { fill: #ffffff; }
      .label, .pagelabel { fill: #d9e1e2; }
      .label.on { fill: #ffffff; }
      .page.on { stroke: #6ad1e3; }
      .pagelabel.on { fill: #6ad1e3; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="178" rx="12"/>

  <!-- Track between the steps -->
  <line class="track" x1="97" y1="46" x2="203" y2="46"/>
  <line class="track" x1="247" y1="46" x2="353" y2="46"/>
  <line class="track" x1="397" y1="46" x2="503" y2="46"/>
  <line class="track" x1="547" y1="46" x2="653" y2="46"/>
  <line class="track" x1="697" y1="46" x2="803" y2="46"/>

  <!-- Step 1 -->
  <circle class="dot" cx="75" cy="46" r="22"/>
  <text class="num" x="75" y="53" text-anchor="middle">1</text>
  <text class="label" x="75" y="96" text-anchor="middle">Choose your</text>
  <text class="label" x="75" y="114" text-anchor="middle">application</text>

  <!-- Step 2 -->
  <circle class="dot on" cx="225" cy="46" r="22"/>
  <text class="num on" x="225" y="53" text-anchor="middle">2</text>
  <text class="label on" x="225" y="96" text-anchor="middle">Set up the repository</text>
  <text class="label on" x="225" y="114" text-anchor="middle">and toolchain</text>

  <!-- Step 3 -->
  <circle class="dot" cx="375" cy="46" r="22"/>
  <text class="num" x="375" y="53" text-anchor="middle">3</text>
  <text class="label" x="375" y="96" text-anchor="middle">Set up the</text>
  <text class="label" x="375" y="114" text-anchor="middle">hardware</text>

  <!-- Step 4 -->
  <circle class="dot" cx="525" cy="46" r="22"/>
  <text class="num" x="525" y="53" text-anchor="middle">4</text>
  <text class="label" x="525" y="96" text-anchor="middle">Build and</text>
  <text class="label" x="525" y="114" text-anchor="middle">flash</text>

  <!-- Step 5 -->
  <circle class="dot" cx="675" cy="46" r="22"/>
  <text class="num" x="675" y="53" text-anchor="middle">5</text>
  <text class="label" x="675" y="96" text-anchor="middle">Connect to</text>
  <text class="label" x="675" y="114" text-anchor="middle">nRF Cloud</text>

  <!-- Step 6 -->
  <circle class="dot" cx="825" cy="46" r="22"/>
  <text class="num" x="825" y="53" text-anchor="middle">6</text>
  <text class="label" x="825" y="96" text-anchor="middle">Verify</text>

  <!-- Which page each step is on -->
  <path class="page" d="M10 132 V138 H140 V132"/>
  <text class="pagelabel" x="75" y="160" text-anchor="middle">Getting started</text>
  <path class="page on" d="M160 132 V138 H290 V132"/>
  <text class="pagelabel on" x="225" y="160" text-anchor="middle">Build from source only</text>
  <path class="page" d="M310 132 V138 H890 V132"/>
  <text class="pagelabel" x="600" y="160" text-anchor="middle">Your application guide</text>
</svg>
