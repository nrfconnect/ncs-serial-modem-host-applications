461.66" y="241.15" fill="#374151" font-size="11" textLength="117.332" font-family="Helvetica">CLOUD_DISCONNECT</text></g><g class="legend" data-source-line="125"><rect x="23.178" y="528.526" width="541.636" height="74.023" fill="none" style="stroke:#CBD5E1;stroke-width:1;" rx="5" ry="5"/><text x="28.178" y="543.737" fill="#475569" font-size="11" textLength="531.636" font-family="Helvetica">STATE_CONNECTING makes one attempt per CLOUD_PRIV_CONNECT_ATTEMPT. An attempt that</text><text x="28.178" y="556.541" fill="#475569" font-size="11" textLength="441.95" font-family="Helvetica">finds no credentials or no valid time, or that fails to connect, schedules the next</text><text x="28.178" y="569.346" fill="#475569" font-size="11" textLength="510.238" font-family="Helvetica">attempt and leaves the module waiting for messages in the meantime. CLOUD_CONNECTED</text><text x="28.178" y="582.151" fill="#475569" font-size="11" textLength="473.779" font-family="Helvetica">is published by the attempt that succeeds. A device message, shadow poll or location</text><text x="28.178" y="594.955" fill="#475569" font-size="11" textLength="327.717" font-family="Helvetica">request that fails publishes CLOUD_PRIV_REQUEST_FAILED.</text></g><?plantuml-src jLTjRo8t4FxEhnZfFjnT5TwIS4ckKQGDB0ag8JHisafjjJ9h0svsxQtjJS9L_UyTxmjPs8NgJYqVG7Z6y_BucV7uFSocWr-QOnumeLbpH9amVC6P-WpvsWDRD2TIKHuqUyr-I1BD6k-X7yg4GYHf4ZBGXXW64GbMN33W0a8-RsSotGwiPlRT2bguTI9HdKln6LgjDb6uoR3098gr8lgESh9K96gAN0drlot0sOeeHa4_OJWBgS2i65nqewuVnp5G6IGH6afTGEvJs-168WWJYXldQs3FJAqBAMYPg81z3nWPaCqgRkT6WtmHNvzQmmON4sjcJeAdfPA9e7qPOhJlXkcdfA5NXCeNBfQm825c-2QXR46Iq0obC1CICRXbuJCpF23rEZF-XK7t1ACTiuLfaf0l1UPBcGuKZsrW6fuOYm7nKUisU-MOhw0M3M7mP3McgnYXP1woLjM5nrwDOsr6gJgwAEda6Ih157Gx9S54ed_qUT8hBJuGyMGNJykBZbBo9GVfq_NPyNbdLsYJp1LEpawxlMwTGeP2MUHn4x8tKQzEb9lj3BjdnqwZiUAK0OjYiox3rx3iIoj2u77e5BmjTBMbPaf8OepYymHL5sZTLiuq9C8ytesFa6ymbsQ5ngosng1eQYh0619BxHLJMmUGLU5V3S3FTOLFtM5lU979i5QOAbBfE1TzDrsl9bYiPeWSf_-T8kI3WWB_4yI_bueH4MMgJjrDXFdYtnQ-gK8s821IX6k