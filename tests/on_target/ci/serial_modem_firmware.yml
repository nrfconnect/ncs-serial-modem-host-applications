# CI locks the newest upstream release shipping this asset (prereleases included)
# for the whole run. Override locally with SERIAL_MODEM_RELEASE.
#
# console_baudrate matches zephyr,console = &uart1 (VCOM1) in the upstream nrf91m1
# overlay; re-check it when that overlay changes.

upstream_repo: nrfconnect/ncs-serial-modem
asset_suffix: _nrf9151dk_nrf91m1.zip
console_baudrate: 1000000
