# Serial Modem firmware settings for 91m1 host + nRF9151 DK setups.
#
# CI resolves the newest upstream release that ships a recognised bundle (including
# prereleases) and locks that tag for the whole pipeline run. Tests flash it on
# the nRF9151 DK; release bundles copy the same archive. Override locally with
# SERIAL_MODEM_RELEASE when you need a specific tag.
#
# Upstream renamed the bundle in v2.0.0-preview3: _nrf9151dk_extmcu.zip became
# _nrf9151dk_nrf91m1.zip and the host UART moved from uart2 (P0.02–P0.07) to
# uart0 (P0.27/P0.26/P0.14/P0.15). See applications/91m1_ppp/doc/hardware-setup.md.
#
# pinned_release keeps CI on preview2 until the bench is rewired for the nrf91m1
# pinout. Remove it (or set SERIAL_MODEM_RELEASE empty and delete the line) once
# preview3 wiring is in place.
#
# Log capture reads zephyr,console = &uart1 (P0.28/P0.29 -> VCOM1). Re-check
# console_baudrate when upstream changes the nrf91m1 overlay.

upstream_repo: nrfconnect/ncs-serial-modem
asset_suffixes:
  - _nrf9151dk_nrf91m1.zip
  - _nrf9151dk_extmcu.zip
pinned_release: v2.0.0-preview2
pinned_asset_suffix: _nrf9151dk_extmcu.zip
console_baudrate: 1000000
