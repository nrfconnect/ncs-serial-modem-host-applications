site_name: Serial Modem Host Applications
site_url:
use_directory_urls: false

docs_dir: docs

theme:
  name: material
  features:
    - content.code.annotate
    - content.tabs.link
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow

copyright:
  Copyright &copy; 2026

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      linenums_style: pymdownx-inline
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - meta
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.tabbed
  - toc:
      permalink: true
      toc_depth: 4

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - macros
  - search
  - gh-admonitions

ft_metadata:
  ft:title: "Serial Modem Host Applications"
  ft:clusterId: "serial-modem-host-applications"
  ft:locale: "en-US"
  tags:
    - "Serial Modem Host Applications"

ft_options:
  copy_button_on_content_code: true
  nav_mapping: first_heading_as_page

nav:
  - Overview: index.md
  - Getting started:
    - Choose your application: getting-started/index.md
    - Set up the repository and toolchain: getting-started/setup.md
    - PPP on nRF54 DK + nRF9151 DK: getting-started/ppp-nrf54.md
    - PPP on nRF93M1 DK: getting-started/ppp-nrf93m1.md
    - nRF93M1 AT: getting-started/93m1-at.md
    - nRF91 AT on nRF54LM20B DK + nRF9151 DK: getting-started/91m1-at.md
  - Applications:
    - PPP Host Application:
      - Overview: applications/ppp/README.md
      - Application behavior: applications/ppp/application-behavior.md
      - Hardware reference: applications/ppp/hardware-setup.md
      - Modules:
        - Main: applications/ppp/modules/main.md
        - Network: applications/ppp/modules/network.md
        - Cloud: applications/ppp/modules/cloud.md
        - FOTA: applications/ppp/modules/fota.md
        - Location: applications/ppp/modules/location.md
      - Remote debugging: applications/ppp/remote-debugging.md
    - nRF93M1 AT Host Application: applications/93m1_at/README.md
    - nRF91 AT Host Application: applications/91m1_at/README.md
  - Architecture: architecture.md
  - Application FOTA: app-fota.md
  - Release artifacts: release-artifacts.md
  - CI and contribution: ci-and-contribution.md
