site_name: Serial Modem Host Applications
site_url:
use_directory_urls: false

docs_dir: docs

theme:
  name: material
  features:
    - content.code.annotate
    - content.tabs.link
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow

copyright:
  Copyright &copy; 2026

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - meta
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed
  - toc:
      permalink: true
      toc_depth: 4

plugins:
  - search

ft_metadata:
  ft:title: "Serial Modem Host Applications"
  ft:clusterId: "serial-modem-host-applications-latest"
  ft:locale: "en-US"
  tags:
    - "Serial Modem Host Applications"

ft_options:
  copy_button_on_content_code: true
  nav_mapping: first_heading_as_page

nav:
  - Overview: index.md
  - Applications:
    - 91m1_ppp:
      - Overview: applications/91m1_ppp/README.md
      - Hardware setup: applications/91m1_ppp/hardware-setup.md
      - Application behavior: applications/91m1_ppp/application-behavior.md
      - Memfault: applications/91m1_ppp/memfault.md
    - 93m1_ppp: applications/93m1_ppp/README.md
    - 93m1_at: applications/93m1_at/README.md
  - CI and contribution: ci-and-contribution.md
  - Release artifacts: release-artifacts.md
