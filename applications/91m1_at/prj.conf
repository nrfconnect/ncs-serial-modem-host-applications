# Application identity
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Serial Modem Host 91m1 (AT)"

# Application modules
CONFIG_APP_NETWORK=y
CONFIG_APP_MODEM_AT=y
CONFIG_APP_CLOUD=y
CONFIG_APP_LOCATION=y
CONFIG_APP_MAIN_LOG_LEVEL_DBG=y
CONFIG_APP_NETWORK_LOG_LEVEL_DBG=y
CONFIG_APP_MODEM_AT_LOG_LEVEL_ERR=y
CONFIG_APP_CLOUD_LOG_LEVEL_DBG=y
CONFIG_APP_LOCATION_LOG_LEVEL_DBG=y

# System / RTOS
CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
# Every publish pins one net_buf per message subscriber until that module's thread
# dequeues it, and the pool is shared by all channels. Provisioning holds the cloud
# thread for minutes while LTE goes down and up, so leave room for the queued events.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=64
# Name channels and observers so a delivery failure says which ones were involved.
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_SMF_INITIAL_TRANSITION=y
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Watchdog
CONFIG_TASK_WDT=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_MIN_TIMEOUT=10000

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
# Off so shell wildcard expansion does not mangle `?`/`*` in AT commands.
CONFIG_SHELL_WILDCARD=n

# Serial Modem link: AT commands over UART. The host runs no IP stack; with PPP up,
# the Serial Modem could not use the default PDN for its own nRF Cloud client.
CONFIG_MODEM_MODULES_LOG_LEVEL_INF=y

# Board peripherals
CONFIG_GPIO=y
