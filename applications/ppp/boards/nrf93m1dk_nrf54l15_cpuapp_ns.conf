CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=y
CONFIG_SHELL_BACKEND_SERIAL_API_ASYNC=y
CONFIG_MODEM_BACKEND_UART_ASYNC_HWFC=y
CONFIG_MODEM_BACKEND_UART_ASYNC_RECEIVE_IDLE_TIMEOUT_MS=1

CONFIG_MODEM_CMUX_MTU=127
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=532
CONFIG_MODEM_CELLULAR_UART_BUFFER_SIZES=532
CONFIG_MODEM_CMUX_MSC_FC_THRESHOLD=32

CONFIG_TFM_SFN=y
CONFIG_TFM_IPC=n
CONFIG_TFM_PSA_FRAMEWORK_HAS_MM_IOVEC=y
CONFIG_TFM_ITS_ENCRYPTED=n

# The NCS default hardware version is the board name, but "nrf93m1dk" is already
# bound to another software type in the shared Memfault project, which makes it reject
# OTA payloads for "smha-93m1". Namespace the hardware version to keep FOTA working.
CONFIG_MEMFAULT_NCS_HW_VERSION="smha-nrf93m1dk"

# Application identity. The Memfault software type is bound to this board's
# hardware version, so it must stay "smha-93m1" for FOTA to keep working.
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Serial Modem Host 93m1"
CONFIG_MEMFAULT_NCS_FW_TYPE="smha-93m1"

# Battery: nPM1300 fuel gauge.
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_MFD=y
CONFIG_NPM13XX_CHARGER=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_MEMFAULT_NRF_PLATFORM_BATTERY_NPM13XX=y
CONFIG_MEMFAULT_BATTERY_METRICS_BOOT_ON_SYSTEM_INIT=y

CONFIG_APP_LOCATION_LOG_LEVEL_DBG=y
CONFIG_APP_BATTERY_LOG_LEVEL_DBG=y

# --- Differences from the nRF54 host configuration, to be unified ------------

# System heap: measured peak 3232 Bytes
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_FPU=n
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_POSIX_API=y
CONFIG_DATE_TIME_THREAD_STACK_SIZE=2048
CONFIG_TFM_CRYPTO_CONC_OPER_NUM=4

CONFIG_NET_LOG=y
CONFIG_MODEM_CMUX_LOG_LEVEL_INF=y
CONFIG_MODEM_MODULES_LOG_LEVEL_INF=y
CONFIG_SHELL_BACKEND_SERIAL_ASYNC_RX_BUFFER_SIZE=64

CONFIG_NET_TCP=n
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_MODEM_CELLULAR_USER_PIPE_BUFFER_SIZES=1024

CONFIG_TLS_MAX_CREDENTIALS_NUMBER=8
CONFIG_COAP_CLIENT_MAX_PATH_LENGTH=400
CONFIG_MBEDTLS_SSL_MAX_FRAGMENT_LENGTH=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=3
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_HEAP_SIZE=28672

CONFIG_APP_CLOUD_THREAD_STACK_SIZE=6144
CONFIG_MEMFAULT_NCS_DEVICE_ID_HW_ID=y
CONFIG_MEMFAULT_PERIODIC_UPLOAD=y
CONFIG_MEMFAULT_PERIODIC_UPLOAD_USE_SYSTEM_WORKQUEUE=y
CONFIG_MEMFAULT_PERIODIC_UPLOAD_INTERVAL_SECS=3600
CONFIG_MEMFAULT_LOGGING_RAM_SIZE=1536
CONFIG_MEMFAULT_LOG_LEVEL_INF=y
CONFIG_MEMFAULT_NCS_LOG_LEVEL_INF=y

CONFIG_FOTA_SOCKET_RETRIES=5
