CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_SHELL_BACKEND_SERIAL_API_ASYNC=y
CONFIG_SHELL_BACKEND_SERIAL_ASYNC_RX_BUFFER_SIZE=64
CONFIG_MODEM_BACKEND_UART_ASYNC_RECEIVE_IDLE_TIMEOUT_MS=1

# The NCS default hardware version is the board name, but "nrf93m1dk" is already
# bound to another software type in the shared Memfault project, which makes it reject
# OTA payloads for "smha-93m1". Namespace the hardware version to keep FOTA working.
CONFIG_MEMFAULT_NCS_HW_VERSION="smha-nrf93m1dk"

# Application identity. The Memfault software type is bound to this board's
# hardware version, so it must stay "smha-93m1" for FOTA to keep working.
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Serial Modem Host 93m1"
CONFIG_MEMFAULT_NCS_FW_TYPE="smha-93m1"

# Battery: nPM1300 fuel gauge.
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_MFD=y
CONFIG_NPM13XX_CHARGER=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_MEMFAULT_NRF_PLATFORM_BATTERY_NPM13XX=y
CONFIG_MEMFAULT_BATTERY_METRICS_BOOT_ON_SYSTEM_INIT=y

# %BCINFO and %WIFISCAN responses for the AT location backend exceed the default
# user pipe buffer.
CONFIG_MODEM_CELLULAR_USER_PIPE_BUFFER_SIZES=1024

CONFIG_APP_LOCATION_LOG_LEVEL_DBG=y
CONFIG_APP_BATTERY_LOG_LEVEL_DBG=y
