# Shell/console on uart30 uses interrupt-driven UART; modem on uart21 is async-only.
CONFIG_UART_30_INTERRUPT_DRIVEN=y
CONFIG_UART_21_INTERRUPT_DRIVEN=n
CONFIG_UART_21_ASYNC=y

CONFIG_TFM_LOG_LEVEL_SILENCE=y

# TF-M flash and RAM sizes come from slot0_s_partition and sram0_s in the devicetree.

# "nrf54lm20dk" is bound to another software type in the shared Memfault project, which
# then rejects OTA payloads for "smha-91m1".
CONFIG_MEMFAULT_NCS_HW_VERSION="smha-nrf54lm20dk"

# MCUboot secondary slot on the external mx25r64 SPI NOR flash.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_STREAM_FLASH_ERASE=y
