CONFIG_UART_ASYNC_API=y
CONFIG_MODEM_BACKEND_UART_ASYNC_HWFC=y

# Shell/console on uart20 uses interrupt-driven UART; modem on uart30 is async-only.
CONFIG_UART_30_INTERRUPT_DRIVEN=n
CONFIG_UART_30_ASYNC=y

# Silence TF-M logs to avoid conflicts with modem UART.
CONFIG_TFM_LOG_LEVEL_SILENCE=y

# Application identity. The Memfault software type is bound to this board's
# hardware version, so it must stay "smha-91m1" for FOTA to keep working.
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Serial Modem Host 91m1"
CONFIG_MEMFAULT_NCS_FW_TYPE="smha-91m1"

CONFIG_MODEM_CMUX_MSC_FC_THRESHOLD=32

# SFN + MM-IOVEC reduce secure-side RAM; ITS encryption
# is disabled because credentials live in Protected Storage, not ITS.
CONFIG_TFM_SFN=y
CONFIG_TFM_IPC=n
CONFIG_TFM_PSA_FRAMEWORK_HAS_MM_IOVEC=y
CONFIG_TFM_ITS_ENCRYPTED=n

# TF-M FLASH/RAM sizes come from the devicetree secure partitions
# (slot0_s_partition and sram0_s in boards/nrf54l15_cpuapp_ns_partitions.dtsi).

# MCUboot secondary slot on the external mx25r64 SPI NOR flash.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_STREAM_FLASH_ERASE=y
