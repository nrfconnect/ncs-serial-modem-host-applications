# MCUboot's own defaults for the nRF54L15 (boot/zephyr/prj.conf and
# socs/nrf54l15_cpuapp.conf), which this directory replaces. Both image slots are
# in RRAM, so no SPI NOR driver is needed.
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_BOOT_ENCRYPT_IMAGE=n
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

CONFIG_SPI_NOR=n
CONFIG_BOOT_WATCHDOG_FEED=n

# Ensure the fastest RRAM write operations
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=32

# Link Time Optimizations
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y
