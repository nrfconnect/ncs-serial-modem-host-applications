#
# Sysbuild counterpart of overlay-location.conf. Sysbuild owns the nRF70
# operating mode and forces CONFIG_WIFI_NRF70=n in the application image unless
# SB_CONFIG_WIFI_NRF70 is set here.
#
#   west build -b nrf54lm20dk/nrf54lm20b/cpuapp/ns -p -- \
#       -DSHIELD=nrf7002eb2 \
#       -DEXTRA_CONF_FILE=overlay-location.conf \
#       -DSB_EXTRA_CONF_FILE=sysbuild-location.conf

SB_CONFIG_WIFI_NRF70=y
SB_CONFIG_WIFI_NRF70_SCAN_ONLY=y
