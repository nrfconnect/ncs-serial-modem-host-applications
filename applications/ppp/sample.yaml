sample:
  name: Serial Modem Host PPP
  description: Host application for an nRF91 Series modem over PPP.
tests:
  serial_modem_host.applications.ppp.nrf54l15:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp/ns
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp/ns
    tags:
      - ci_build
  serial_modem_host.applications.ppp.nrf54lm20b:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp/ns
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp/ns
    tags:
      - ci_build
  serial_modem_host.applications.ppp.nrf54lm20b.location:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp/ns
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp/ns
    extra_args:
      - SHIELD=nrf7002eb2
      - EXTRA_CONF_FILE=overlay-location.conf
      - SB_EXTRA_CONF_FILE=sysbuild-location.conf
    tags:
      - ci_build
  serial_modem_host.applications.ppp.nrf93m1:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf93m1dk/nrf54l15/cpuapp/ns
    platform_allow:
      - nrf93m1dk/nrf54l15/cpuapp/ns
    tags:
      - ci_build
