# nRF54LM20B DK: console on uart30 (VCOM0), modem on uart21.

CONFIG_UART_ASYNC_API=y
CONFIG_MODEM_BACKEND_UART_ASYNC_HWFC=y

# Shell/console on uart30 uses interrupt-driven UART; modem on uart21 is async-only.
CONFIG_UART_30_INTERRUPT_DRIVEN=y
CONFIG_UART_21_INTERRUPT_DRIVEN=n
CONFIG_UART_21_ASYNC=y

CONFIG_TFM_LOG_LEVEL_SILENCE=y

CONFIG_MODEM_CMUX_MSC_FC_THRESHOLD=32
CONFIG_MODEM_MODULES_LOG_LEVEL_WRN=y
CONFIG_LOG_BUFFER_SIZE=8192

CONFIG_TFM_SFN=y
CONFIG_TFM_IPC=n
CONFIG_TFM_PSA_FRAMEWORK_HAS_MM_IOVEC=y
CONFIG_TFM_ITS_ENCRYPTED=n

CONFIG_PM_PARTITION_SIZE_TFM=0x20000
CONFIG_PM_PARTITION_SIZE_TFM_SRAM=0xC000

# The NCS default hardware version is the board name, but "nrf54lm20dk" is already
# bound to another software type in the shared Memfault project, which makes it reject
# OTA payloads for "smha-91m1". Namespace the hardware version to keep FOTA working.
CONFIG_MEMFAULT_NCS_HW_VERSION="smha-nrf54lm20dk"
