# Wi-Fi based location using the nRF7002-EB2 shield. Requires the matching
# sysbuild overlay to build the nRF70 driver in scan only mode:
#
#   west build -b nrf54lm20dk/nrf54lm20b/cpuapp/ns -p -- \
#       -DSHIELD=nrf7002eb2 \
#       -DEXTRA_CONF_FILE=overlay-location.conf \
#       -DSB_EXTRA_CONF_FILE=sysbuild-location.conf

# EB2 shield moves the console to uart30 (VCOM0).
CONFIG_UART_30_INTERRUPT_DRIVEN=y
CONFIG_UART_30_ASYNC=n

# --- Wi-Fi (nRF7002-EB2, scan only) --------------------------------------------

# The nRF70 driver itself is enabled from sysbuild, see sysbuild-location.conf.
CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=n
CONFIG_WIFI_NRF70_SKIP_LOCAL_ADMIN_MAC=y
# Keep aligned with CONFIG_LOCATION_METHOD_WIFI_SCANNING_RESULTS_MAX_CNT.
CONFIG_NRF_WIFI_SCAN_MAX_BSS_CNT=10
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=10240
CONFIG_HEAP_MEM_POOL_SIZE=28672

# The nRF70 interface is an Ethernet L2 interface. PPP remains the default
# interface so that sockets keep using the Serial Modem.
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DEFAULT_IF_PPP=y

# One IPv4 config slot per interface. The slots are handed out in interface
# registration order, so with the default of 1 the Wi-Fi interface takes the
# only slot and PPP never gets an address from IPCP.
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# Wi-Fi scan results are delivered as network management events.
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# --- Location (Wi-Fi positioning via nRF Cloud) --------------------------------

CONFIG_LOCATION=y
CONFIG_LOCATION_METHOD_WIFI=y
CONFIG_LOCATION_SERVICE_EXTERNAL=y
CONFIG_LOCATION_METHOD_WIFI_SCANNING_RESULTS_MAX_CNT=10
CONFIG_LOCATION_REQUEST_DEFAULT_WIFI_TIMEOUT=30000
CONFIG_APP_LOCATION_LOG_LEVEL_DBG=y
