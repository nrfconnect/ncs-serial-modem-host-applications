ell-to-ModemAt"/><polygon points="698,114.69,702,105.69,698,109.69,694,105.69,698,114.69" fill="#94A3B8" style="stroke:#94A3B8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="699" y="82.84" fill="#374151" font-size="11" textLength="91.013" font-family="Helvetica">modem_at_run()</text></g><g class="legend" data-source-line="126"><rect x="201.399" y="291.403" width="483.333" height="74.023" fill="none" style="stroke:#CBD5E1;stroke-width:1;" rx="5" ry="5"/><text x="206.399" y="306.613" fill="#475569" font-size="11" textLength="450.425" font-family="Helvetica">Every module owns one channel, and both the requests sent to a module and the</text><text x="206.399" y="319.418" fill="#475569" font-size="11" textLength="460.351" font-family="Helvetica">notifications it publishes go on that channel. All communication passes through the</text><text x="206.399" y="332.223" fill="#475569" font-size="11" textLength="473.333" font-family="Helvetica">Main module, the only module that knows about the others. The Modem AT module is</text><text x="206.399" y="345.027" fill="#475569" font-size="11" textLength="459.707" font-family="Helvetica">outside the message graph: it serializes access to the modem AT pipe and is called</text><text x="206.399" y="357.832" fill="#475569" font-size="11" textLength="151.959" font-family="Helvetica">directly from the host shell.</text></g><?plantuml-src jLVRRXit47tVhnWa3sa1IP5iAxOL8u0iItLGspLY5otG50QrEzAoeiWjoRMj5Ftt3Yyhhwv1WrOlaZY7Spay98TluExsujVc5KzH6cn-p51QFk6eUn37Fk6aUQDqnjDcjpaGh3IOl85hbPK23J2PWSqHlenB0sdEf4HXtCW2KZMVbvAdp2AeHzGjkDNyqVrRufXslWHEBAZIlWU32AtMMwRJd5jCRQcnDSzU5s5UivhNeadVblPTJY4pC3CkOQAqJ_sqC-yy54K1cKhBEJbYbYi96MTJpUO-s4UPYZAZYUC589MogAnWLAbJV0zIMM3BKPhEhG7r9Dti6nLSzhRL5gSqPGGbYKkkOCxDcAMpgLQbp0PAKBQlH_vJGvYSPUg9oobCcA0ANomPJbWfx4X9UyFc29Se7j7IQcp7tF4l29r3olQALgF919zAgZT3asfUkCGCp10B87xquYq-S-lNdjYG5WGtLAv6bh6nmDPcY7jyjdtdS-xX5AA6YHLgYHewxPhXHb5yYddOhGr-OdBc1e_gWtsjrLCawTtvyS59UzteYeo0m-EZJhUp3H1Og9lkkHNuOkfkCqMtxL